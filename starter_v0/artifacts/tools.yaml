# Tool declarations: each description says WHAT / WHEN to use / WHEN NOT to use.
# Keep in sync with tools/__init__.py (TOOL_FUNCTIONS) and data/eval_*.json.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user ONE question and wait for the next turn. Use when required info is missing (no account/handle, no URL) or before any write action (response_type=yes_no). Do NOT use when the request is already complete."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Short question shown to the user. For yes_no confirmation include the exact text to be sent."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text = free answer (missing handle/URL); yes_no = confirm an action (e.g. before send); choice = pick from options."}
        options: {type: array, default: [], items: {type: string}, description: "Only for response_type=choice."}
      required: [question]

  - name: timeline
    description: "Get recent posts FROM ONE specific X/Twitter account. Use when the user names a person/account ('tweet mới nhất của Sam Altman'). Do NOT use for topic searches (use social_search) or when the account is unknown (use clarify)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle WITHOUT '@', lowercase. Map names: Sam Altman=sama, Elon Musk=elonmusk, Andrej Karpathy=karpathy."}
        limit: {type: integer, default: 5, description: "Number of posts; copy the number the user asked for (e.g. '10 tweet' -> 10)."}
      required: [screenname]

  - name: social_search
    description: "Search X/Twitter posts ABOUT a keyword/topic ('mọi người nói gì về GPT-5'). Do NOT use for one person's posts (use timeline) or for news articles (use lookup)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Keyword or topic, e.g. 'GPT-5', 'OpenAI'."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top when the user says phổ biến / top / hot / nổi bật; Latest otherwise."}
        limit: {type: integer, default: 5, description: "Number of posts."}
      required: [query]

  - name: lookup
    description: "Search the public web (Tavily). Use for news and general info without a URL. Do NOT use when the user already gave a URL (use fetch) or for tweets (use social_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search keywords, short (e.g. 'AI', 'robotics')."}
        topic: {type: string, enum: [general, news], default: "general", description: "news for news / tin tức / thời sự; general for everything else."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "hôm nay=day, tuần này=week, tháng này=month, năm nay=year."}
        max_results: {type: integer, default: 5, description: "Number of results."}
      required: [query]

  - name: fetch
    description: "Read the content of ONE concrete URL (Firecrawl). Use when the user asks to read or summarize the link, or when a needed source has no excerpt. For a claim comparison or source trace with the evidence or citation relationships already provided, use the corresponding analysis tool directly. Never invent a URL (use clarify to ask)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Full URL exactly as the user wrote it."}
      required: [url]

  - name: format
    description: "Format ALREADY collected items into a markdown digest. Local only; does not fetch anything. Use after other tools returned items."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items collected from other tools."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "brief = top 5; sections = grouped; bullets = flat list; thread = numbered 1/ 2/; daily_ai_vn = Vietnamese daily AI news."}
        headline: {type: string, default: "", description: "Digest title."}
      required: [items, template]

  - name: build_evidence_card
    description: "Compare one claim against source excerpts already supplied or collected. Use for requests to check a claim or explain why sources disagree. Group each excerpt as supports, contradicts, or unclear. Never invent URLs or excerpts. A URL with no excerpt must be read first. Returns a Telegram-ready Markdown preview. For a general digest use format."
    parameters:
      type: object
      properties:
        claim: {type: string, description: "The single factual claim being evaluated."}
        evidence:
          type: array
          description: "Relevant excerpts from sources already read. Use an empty list if no usable source is available."
          items:
            type: object
            properties:
              url: {type: string, description: "The HTTP(S) URL actually supplied or returned for this source."}
              summary: {type: string, description: "A short paraphrase of what this source says about the claim."}
              stance: {type: string, enum: [supports, contradicts, unclear], description: "How the excerpt relates to the claim. Use unclear when the excerpt does not establish either side."}
            required: [url, summary, stance]
      required: [claim, evidence]

  - name: build_metric_delta_card
    description: "Calculate the absolute and relative change between two observations of the same metric. Use when the user asks how much a metric rose or fell, or requests a before/after KPI card. Use supplied or collected observations. Preserve both periods and units. A source URL belongs inside its observation. Omit url when no source URL is available. Ask for missing values or units and never invent data."
    parameters:
      type: object
      additionalProperties: false
      properties:
        metric: {type: string, description: "Short name of the metric being compared."}
        baseline:
          type: object
          additionalProperties: false
          description: "The earlier observation."
          properties:
            value: {type: number, description: "Numeric value, e.g. 20 for 20%."}
            period: {type: string, description: "Label for this period as given by the user or source."}
            unit: {type: string, description: "Unit, e.g. %, USD, users. Match the current observation."}
            url: {type: string, description: "HTTP(S) source URL when supplied or retrieved."}
          required: [value, period, unit]
        current:
          type: object
          additionalProperties: false
          description: "The later observation."
          properties:
            value: {type: number, description: "Numeric value, e.g. 26 for 26%."}
            period: {type: string, description: "Label for this period as given by the user or source."}
            unit: {type: string, description: "Unit, e.g. %, USD, users. Match the baseline observation."}
            url: {type: string, description: "HTTP(S) source URL when supplied or retrieved."}
          required: [value, period, unit]
      required: [metric, baseline, current]

  - name: trace_source_chain
    description: "Trace where a story comes from, or check whether multiple reports rely on a shared source. Use when the user asks about source independence, a citation chain, or a source map. Call directly when document URLs and direct citation relationships are already provided. Include every supplied document as its own article, including a known endpoint with an empty cites array. Include only confirmed citation links relevant to the story."
    parameters:
      type: object
      additionalProperties: false
      properties:
        articles:
          type: array
          description: "All supplied documents, including each supplied terminal source with cites: []. Omit only destinations whose details were not supplied or verified."
          minItems: 1
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            properties:
              url: {type: string, description: "Actual HTTP(S) URL of this document."}
              title: {type: string, description: "Short title if known."}
              cites:
                type: array
                maxItems: 12
                items: {type: string}
                description: "Direct citation URLs for this story. Use [] if this supplied document ends the chain. If a cited document was not supplied or examined, keep its URL here and omit its document entry."
            required: [url, cites]
      required: [articles]

  - name: rate_sources
    description: "Rate how trustworthy URLs are by their domain: tier1 (official or primary, such as arXiv, company blogs, .gov, .edu), tier2 (reputable press), tier3 (social media or forums, only an early signal), unknown. Use when the user asks whether sources or links are reliable or credible, or before presenting claims as verified. Judges the domain only, not the article. Local, no network. Do NOT use to read a page (fetch), to compare what sources say (build_evidence_card) or to trace citations (trace_source_chain)."
    parameters:
      type: object
      properties:
        urls:
          type: array
          maxItems: 50
          items: {type: string}
          description: "The HTTP(S) URLs to rate, exactly as supplied or returned by other tools. Never invent URLs."
      required: [urls]

  - name: dedupe_items
    description: "Remove duplicate items from results already collected, keeping the first of each: same URL (ignoring www, tracking parameters and a trailing slash) or same title. Use when results from several searches overlap, or the user asks to remove duplicates, before building a digest with format. Local only; does not fetch or search. Do NOT use to summarize."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "The collected items, in their original order."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
      required: [items]

  - name: parse_time_range
    description: "Convert a Vietnamese or English time phrase (hôm nay, hôm qua, tuần này, 3 ngày qua, last month) into concrete start and end dates and the matching lookup timeframe (day, week, month, year). Use ONLY when the user asks for explicit dates or a date range. For ordinary news requests do NOT use it: pass timeframe straight to lookup. Local, no network."
    parameters:
      type: object
      properties:
        text: {type: string, description: "The time phrase exactly as the user wrote it, for example 'tuần này' or '3 ngày qua'."}
        today: {type: string, description: "Optional ISO date YYYY-MM-DD to count back from. Omit to use today's date."}
      required: [text]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Post text to the Telegram channel. SIDE EFFECT. Only call with confirmed=true AFTER the user explicitly said yes to the exact text in a previous turn. If not yet confirmed, call clarify(response_type=yes_no) instead."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Exact text the user approved."}
        confirmed: {type: boolean, default: false, description: "true ONLY if the user explicitly confirmed in this conversation; otherwise false."}
      required: [text]

  - name: policy
    description: "Search internal company policy markdown (publishing, privacy, citation, tool usage, AI research). Use for 'công ty quy định gì...'. Do NOT use for current news or the public web."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy question keywords."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Restrict to one area when obvious, else all."}
        top_k: {type: integer, default: 3, description: "Number of sections."}
      required: [query]

  - name: papers
    description: "Search arXiv for academic papers/preprints by keyword. Do NOT use for news (lookup) or to read a known paper (paper_text)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper topic keywords."}
        max_results: {type: integer, default: 5, description: "Number of papers."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "submittedDate for 'mới nhất'."}
      required: [query]

  - name: paper_text
    description: "Download an arXiv paper and extract its text. Use when the user gives an arXiv id/URL and wants to inspect content. Do NOT use to search papers."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv id (1706.03762) or URL."}
        max_pages: {type: integer, default: 5, description: "Pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Max characters returned."}
      required: [arxiv_url]

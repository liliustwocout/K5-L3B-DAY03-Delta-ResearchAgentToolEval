# Tool declarations cho model local (v5-local): chỉ 6 tool, bỏ format/policy/papers/paper_text để giảm nhiễu.
# Chỉ dùng cho chạy eval base trên model nhỏ; bản đầy đủ là artifacts/tools.yaml.
tools:
- name: clarify
  description: Ask the user ONE question and wait for the next turn. Use when required info is missing (no account/handle, no URL) or before any write action (response_type=yes_no). Do NOT use when the request is already complete.
  parameters:
    type: object
    properties:
      question:
        type: string
        default: ''
        description: Short question shown to the user. For yes_no confirmation include the exact text to be sent.
      response_type:
        type: string
        enum:
        - text
        - yes_no
        - choice
        default: text
        description: text = free answer (missing handle/URL); yes_no = confirm an action (e.g. before send); choice = pick from options.
      options:
        type: array
        default: []
        items:
          type: string
        description: Only for response_type=choice.
    required:
    - question
- name: timeline
  description: Get recent posts FROM ONE specific X/Twitter account. Use when the user names a person/account ('tweet mới nhất của Sam Altman'). Do NOT use for topic searches (use social_search) or when the account is unknown (use clarify).
  parameters:
    type: object
    properties:
      screenname:
        type: string
        default: ''
        description: 'Handle WITHOUT ''@'', lowercase. Map names: Sam Altman=sama, Elon Musk=elonmusk, Andrej Karpathy=karpathy.'
      limit:
        type: integer
        default: 5
        description: Number of posts; copy the number the user asked for (e.g. '10 tweet' -> 10).
    required:
    - screenname
- name: social_search
  description: Search X/Twitter posts ABOUT a keyword/topic ('mọi người nói gì về GPT-5'). Do NOT use for one person's posts (use timeline) or for news articles (use lookup).
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Keyword or topic, e.g. 'GPT-5', 'OpenAI'.
      search_type:
        type: string
        enum:
        - Latest
        - Top
        default: Latest
        description: Top when the user says phổ biến / top / hot / nổi bật; Latest otherwise.
      limit:
        type: integer
        default: 5
        description: Number of posts.
    required:
    - query
- name: lookup
  description: Search the public web (Tavily). Use for news and general info without a URL. Do NOT use when the user already gave a URL (use fetch) or for tweets (use social_search).
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Search keywords, short (e.g. 'AI', 'robotics').
      topic:
        type: string
        enum:
        - general
        - news
        default: general
        description: news for news / tin tức / thời sự; general for everything else.
      timeframe:
        type: string
        enum:
        - day
        - week
        - month
        - year
        default: week
        description: hôm nay=day, tuần này=week, tháng này=month, năm nay=year.
      max_results:
        type: integer
        default: 5
        description: Number of results.
    required:
    - query
- name: fetch
  description: Read the content of ONE concrete URL (Firecrawl). Use when the user gives a link to read or summarize. Do NOT use to search, and never invent a URL (use clarify to ask).
  parameters:
    type: object
    properties:
      url:
        type: string
        default: ''
        description: Full URL exactly as the user wrote it.
    required:
    - url
- name: send
  description: Post text to the Telegram channel. SIDE EFFECT. Only call with confirmed=true AFTER the user explicitly said yes to the exact text in a previous turn. If not yet confirmed, call clarify(response_type=yes_no) instead.
  parameters:
    type: object
    properties:
      text:
        type: string
        default: ''
        description: Exact text the user approved.
      confirmed:
        type: boolean
        default: false
        description: true ONLY if the user explicitly confirmed in this conversation; otherwise false.
    required:
    - text
